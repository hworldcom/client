name: Build client executables

on:
  push:
    tags:
      - "client-v*.*.*"   # tag like client-v1.0.7

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  APP_NAME: scrapeclient        # <- your binary name
  ENTRY: client.py              # <- your python entry file

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
      - name: Build single-file
        run: |
          pyinstaller --onefile --name "$APP_NAME" "$ENTRY"
      - name: Collect artifact (normalized name)
        run: |
          mkdir -p release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "dist/${APP_NAME}.exe" "release/${APP_NAME}-windows-x64.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "dist/${APP_NAME}" "release/${APP_NAME}-macos-arm64"
          else
            cp "dist/${APP_NAME}" "release/${APP_NAME}-linux-x64"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifact
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./collected

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find collected -type f -exec cp {} release/ \;
          ls -al release

      # ---- Package macOS as ZIP with a double-click launcher ----
      - name: Package macOS (.zip with run.command)
        run: |
          set -euo pipefail
          APP="$APP_NAME"
          MAC_BIN="release/${APP}-macos-arm64"
          # README for mac users
          cat > release/README-mac.txt <<'TXT'
          How to run:
          1) Double-click run.command (macOS will open Terminal and execute the app)
          2) If you see an "unidentified developer" prompt, right-click run.command → Open → Open
          TXT
          # run.command that launches the binary and keeps the window open
          cat > release/run.command <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")"
          export API_BASE="https://api.lnlabs.xyz"
          chmod +x "./'"$APP_NAME"'-macos-arm64"
          "./'"$APP_NAME"'-macos-arm64"
          echo
          read -n 1 -s -p "Press any key to close"
          SH
          chmod +x release/run.command
          # Make sure the binary is executable before zipping (permission preserved in zip)
          chmod +x "$MAC_BIN"
          # Create the zip (no folder nesting; all files at top level)
          (cd release && zip -q -r "${APP}-macos-arm64.zip" "${APP}-macos-arm64" run.command README-mac.txt)

      # ---- Package Linux as tar.gz (preserves +x) ----
      - name: Package Linux (.tar.gz)
        run: |
          set -euo pipefail
          APP="$APP_NAME"
          LIN_BIN="release/${APP}-linux-x64"
          chmod +x "$LIN_BIN"
          (cd release && tar -czf "${APP}-linux-x64.tar.gz" "${APP}-linux-x64")

      # ---- Compute SHA256 of packaged files (and exe) + Build manifest ----
      - name: Build manifest (Python, clean)
        env:
          TAG: ${{ github.ref_name }}  # e.g., client-v1.0.7
        run: |
          python3 - <<'PY'
          import os, json, hashlib, pathlib
          app   = os.environ.get("APP_NAME", "scrapeclient")
          tag   = os.environ["TAG"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          repo  = os.environ["GITHUB_REPOSITORY"].split("/")[1]
          base  = f"https://github.com/{owner}/{repo}/releases/download/{tag}"

          # Our shipped assets
          win = f"{app}-windows-x64.exe"
          mac = f"{app}-macos-arm64.zip"     # packaged zip
          lin = f"{app}-linux-x64.tar.gz"    # packaged tar.gz

          def sha256(path: pathlib.Path) -> str:
            h = hashlib.sha256()
            with path.open("rb") as f:
              for chunk in iter(lambda: f.read(1<<20), b""):
                h.update(chunk)
            return h.hexdigest()

          rel = pathlib.Path("release")
          manifest = {
            "version": tag.removeprefix("client-v"),
            "assets": {
              "windows": {"url": f"{base}/{win}", "sha256": sha256(rel / win)},
              "macos":   {"url": f"{base}/{mac}", "sha256": sha256(rel / mac)},
              "linux":   {"url": f"{base}/{lin}", "sha256": sha256(rel / lin)},
            },
          }
          with open(rel / "client-manifest.json","w",encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ env.APP_NAME }}-windows-x64.exe
            release/${{ env.APP_NAME }}-macos-arm64.zip
            release/${{ env.APP_NAME }}-linux-x64.tar.gz
            release/client-manifest.json
          generate_release_notes: true
