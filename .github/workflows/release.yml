name: Build client executables

on:
  push:
    tags:
      - "client-v*.*.*"   # tag like client-v1.2.0

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  # ---- Names you can customize ----
  CLI_NAME: scrapeclient                 # final name for CLI binary
  GUI_NAME: lnlabs-agent                 # final name for GUI app/artifacts (no spaces)
  # ---- Entrypoints (update if you placed files elsewhere) ----
  CLI_ENTRY: src/lnlabs_agent/cli.py     # headless agent
  GUI_ENTRY: src/lnlabs_agent/gui.py     # Tkinter GUI
  # ---- Icon files (optional) ----
  MAC_ICON: assets/icon.icns
  WIN_ICON: assets/icon.ico

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pyinstaller

      # ---------- macOS: build GUI app + DMG ----------
      - name: Build GUI (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pyinstaller -w -n "$GUI_NAME" -i "$MAC_ICON" -p src "$GUI_ENTRY"
          # Create DMG
          brew install create-dmg || true
          mkdir -p release
          create-dmg "release/${GUI_NAME}-macos-arm64.dmg" "dist/${GUI_NAME}.app"
          ls -al release

      # ---------- Windows: build GUI exe ----------
      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          pyinstaller -F -w -n "$GUI_NAME" -i "$WIN_ICON" -p src "$GUI_ENTRY"
          mkdir -p release
          cp "dist/${GUI_NAME}.exe" "release/${GUI_NAME}-windows-x64.exe"
          ls -al release

      # ---------- Linux: build CLI onefile + tar.gz ----------
      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          pyinstaller --onefile --name "$CLI_NAME" -p src "$CLI_ENTRY"
          mkdir -p release
          chmod +x "dist/${CLI_NAME}"
          cp "dist/${CLI_NAME}" "release/${CLI_NAME}-linux-x64"
          (cd release && tar -czf "${CLI_NAME}-linux-x64.tar.gz" "${CLI_NAME}-linux-x64")
          ls -al release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./collected

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find collected -type f -exec cp {} release/ \;
          echo "Collected:"
          ls -al release

      # ---- Compute SHA256 and build manifest pointing to DMG/EXE/tar.gz ----
      - name: Build manifest (Python)
        env:
          TAG: ${{ github.ref_name }}  # e.g., client-v1.2.0
          REPO: ${{ github.repository }} # owner/repo
          GUI_NAME: ${{ env.GUI_NAME }}
          CLI_NAME: ${{ env.CLI_NAME }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, pathlib, urllib.parse
          tag   = os.environ["TAG"]
          repo  = os.environ["REPO"]               # owner/repo
          owner = repo.split('/')[0]
          name  = repo.split('/')[1]
          gui   = os.environ["GUI_NAME"]
          cli   = os.environ["CLI_NAME"]
          base  = f"https://github.com/{owner}/{name}/releases/download/{tag}"

          # Filenames we produced:
          mac = f"{gui}-macos-arm64.dmg"
          win = f"{gui}-windows-x64.exe"
          lin = f"{cli}-linux-x64.tar.gz"

          def sha256(path: pathlib.Path) -> str:
            h = hashlib.sha256()
            with path.open("rb") as f:
              for chunk in iter(lambda: f.read(1<<20), b""):
                h.update(chunk)
            return h.hexdigest()

          rel = pathlib.Path("release")
          files = { "macos": mac, "windows": win, "linux": lin }

          for label, fn in files.items():
            p = rel / fn
            if not p.exists():
              raise SystemExit(f"Missing artifact for {label}: {p}")

          manifest = {
            "version": tag.removeprefix("client-v"),
            "assets": {
              "macos":   {"url": f"{base}/{urllib.parse.quote(mac)}", "sha256": sha256(rel / mac)},
              "windows": {"url": f"{base}/{urllib.parse.quote(win)}", "sha256": sha256(rel / win)},
              "linux":   {"url": f"{base}/{urllib.parse.quote(lin)}", "sha256": sha256(rel / lin)},
            },
          }
          (rel / "client-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False), encoding="utf-8")
          print("Manifest:")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ env.GUI_NAME }}-macos-arm64.dmg
            release/${{ env.GUI_NAME }}-windows-x64.exe
            release/${{ env.CLI_NAME }}-linux-x64.tar.gz
            release/client-manifest.json
          generate_release_notes: true
